# Builds BloodCash on Windows, Linux and macOS at every push and pull request.
# On a version tag (v0.8.0, ...) the portable zips are attached to a GitHub release.
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja, vcpkg, static SDL2)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-ci

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build-ci -OutDir dist

      - uses: actions/upload-artifact@v4
        with:
          name: bloodcash-windows-x64
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: |
          cmake --preset linux -DBC_LINUX_PORTABLE=ON
          cmake --build build -j
      - name: Package
        run: |
          mkdir -p dist/bloodcash
          strip -o dist/bloodcash/bloodcash build/bloodcash
          cp README.md LICENSE CHANGELOG.md dist/bloodcash/
          cd dist && tar czf bloodcash-${GITHUB_REF_NAME//\//-}-linux-x64.tar.gz bloodcash
      - uses: actions/upload-artifact@v4
        with:
          name: bloodcash-linux-x64
          path: dist/*.tar.gz
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install sdl2
      - name: Build
        run: |
          cmake --preset linux
          cmake --build build -j
      - name: Package
        run: |
          mkdir -p dist/bloodcash
          cp build/bloodcash README.md LICENSE CHANGELOG.md dist/bloodcash/
          cd dist && zip -r bloodcash-${GITHUB_REF_NAME//\//-}-macos.zip bloodcash
      - uses: actions/upload-artifact@v4
        with:
          name: bloodcash-macos
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
